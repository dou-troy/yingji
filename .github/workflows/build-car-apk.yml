name: 构建映集车机版 APK

on:
  push:
    paths:
      - 'car-android/**'
      - '.github/workflows/build-car-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - name: 安装 Gradle 8.2
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-8.2/bin" >> "$GITHUB_PATH"

      - name: 编译 APK
        working-directory: car-android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 产出安装包
        run: cp car-android/app/build/outputs/apk/debug/app-debug.apk yingji-car.apk

      - name: 发布到 Releases（车机浏览器可直接下载）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view car-apk-latest >/dev/null 2>&1 \
            || gh release create car-apk-latest --title "映集车机版 APK" --notes "车机专用安装包 · Android 横屏 · 数据沿用网页版后端"
          gh release upload car-apk-latest yingji-car.apk --clobber

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: yingji-car-apk
          path: yingji-car.apk
